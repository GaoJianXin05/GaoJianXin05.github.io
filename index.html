/* Layout: one fixed, living pixel world behind the page; the camera travels sideways as you scroll,
   stopping at a landmark for each section (home → workshop → library tower → windmill → summit → campfire).
   Content floats over it in glass panels, 1120px column. */
@property --ink{syntax:'<color>';inherits:true;initial-value:#1d2230}
@property --ink-2{syntax:'<color>';inherits:true;initial-value:#465066}
@property --ink-3{syntax:'<color>';inherits:true;initial-value:#6e778c}
@property --accent{syntax:'<color>';inherits:true;initial-value:#2c8a55}
@property --glass{syntax:'<color>';inherits:true;initial-value:#ffffff}
@property --glass-2{syntax:'<color>';inherits:true;initial-value:#ffffff}
@property --slot{syntax:'<color>';inherits:true;initial-value:#fbf8f1}
@property --paper{syntax:'<color>';inherits:true;initial-value:#fbf9f4}
@property --nav{syntax:'<color>';inherits:true;initial-value:#ffffff}

:root{
  --bg:#cfe6f5;
  --ink:#1b2130; --ink-2:#434d63; --ink-3:#69728a;
  --accent:#2c8a55; --accent-2:#2fc6b6; --accent-ink:#ffffff; --inv-ink:#ffffff;
  --glass:rgba(255,255,255,.8); --glass-2:rgba(255,255,255,.62);
  --line:rgba(31,36,48,.12); --line-2:rgba(31,36,48,.24); --rim:rgba(255,255,255,.9);
  --slot:#fbf8f1; --bev-hi:rgba(255,255,255,.95); --bev-lo:rgba(70,56,34,.2);
  --nav:rgba(250,252,255,.76); --chip:rgba(31,36,48,.06); --paper:#fbf9f4; --code:#eff1f4;
  --hud-bg:rgba(255,255,255,.7); --halo:rgba(255,255,255,.85);
  --xp-track:rgba(20,26,36,.22); --xp-gap:rgba(0,0,0,.26);
  --r-common:#7f8695; --r-uncommon:#36952f; --r-rare:#2d6fd6; --r-epic:#8a4bd8; --r-legendary:#c97f0e;
  --shadow:0 30px 70px -34px rgba(20,30,60,.45);
  --tip-bg:rgba(17,14,30,.93); --tip-ink:#eceaf5; --tip-dim:#a7a4bb;
  --t-common:#e6e9ef; --t-uncommon:#7ee86a; --t-rare:#6cb2ff; --t-epic:#c79bff; --t-legendary:#ffcb5a;
  --xp-a:#79dc4f; --xp-b:#2fc6b6;
  --f-pixel:"Pixelify Sans","FusionPx","Noto Sans SC",system-ui,sans-serif;
  --f-ui:"Pixelify Sans","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-hud:"Silkscreen","FusionPx",ui-monospace,monospace;
  --f-num:"VT323",ui-monospace,monospace;
  --f-body:"Rubik","Noto Sans SC","PingFang SC",system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --maxw:1120px;
  transition:--ink .9s,--ink-2 .9s,--ink-3 .9s,--accent .9s,--glass .9s,--glass-2 .9s,--slot .9s,--paper .9s,--nav .9s;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1022;
    --ink:#eef0f7; --ink-2:#b6bdd0; --ink-3:#8a93a8;
    --accent:#7ddc6f; --accent-ink:#0f1a0e; --inv-ink:#12151d;
    --glass:rgba(12,14,28,.76); --glass-2:rgba(255,255,255,.05);
    --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.22); --rim:rgba(255,255,255,.12);
    --slot:#232737; --bev-hi:rgba(255,255,255,.08); --bev-lo:rgba(0,0,0,.45);
    --nav:rgba(12,14,26,.76); --chip:rgba(255,255,255,.07); --paper:#151821; --code:#0d1016;
    --hud-bg:rgba(10,14,30,.62); --halo:rgba(4,6,18,.85);
    --xp-track:rgba(0,0,0,.5); --xp-gap:rgba(0,0,0,.55);
    --r-common:#b9c0cc; --r-uncommon:#6fd65a; --r-rare:#5aa0ff; --r-epic:#b98aff; --r-legendary:#ffc04a;
    --shadow:0 30px 70px -30px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1022;
  --ink:#eef0f7; --ink-2:#b6bdd0; --ink-3:#8a93a8;
  --accent:#7ddc6f; --accent-ink:#0f1a0e; --inv-ink:#12151d;
  --glass:rgba(12,14,28,.76); --glass-2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.22); --rim:rgba(255,255,255,.12);
  --slot:#232737; --bev-hi:rgba(255,255,255,.08); --bev-lo:rgba(0,0,0,.45);
  --nav:rgba(12,14,26,.76); --chip:rgba(255,255,255,.07); --paper:#151821; --code:#0d1016;
  --hud-bg:rgba(10,14,30,.62); --halo:rgba(4,6,18,.85);
  --xp-track:rgba(0,0,0,.5); --xp-gap:rgba(0,0,0,.55);
  --r-common:#b9c0cc; --r-uncommon:#6fd65a; --r-rare:#5aa0ff; --r-epic:#b98aff; --r-legendary:#ffc04a;
  --shadow:0 30px 70px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.px{image-rendering:crisp-edges;image-rendering:pixelated}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:20px}
.cut{clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.cut8{clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px)}
.sample{font:10px/1 var(--f-hud);letter-spacing:.06em;padding:3px 5px;background:var(--chip);color:var(--ink-3);vertical-align:middle;white-space:nowrap}
.eyebrow{margin:0;font:12px var(--f-hud);letter-spacing:.07em;color:var(--ink-3)}
#world{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
main,footer{position:relative;z-index:1}

/* ---------- nav + xp ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background-color .35s,box-shadow .35s}
.nav.scrolled{background:var(--nav);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 1px 0 var(--line)}
.nav-in{height:56px;display:flex;align-items:center;gap:18px;max-width:var(--maxw);margin-inline:auto;padding-inline:20px}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo-mark{width:38px;height:38px;display:grid;place-items:center;background:var(--slot);box-shadow:inset 2px 2px 0 var(--bev-hi),inset -2px -2px 0 var(--bev-lo);color:var(--accent);transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}
.logo-mark svg{width:26px;height:auto;shape-rendering:crispEdges}
.logo-txt{font:600 17px var(--f-ui)}
.links{display:flex;gap:4px;margin-left:auto}
.links a{position:relative;font:500 15px var(--f-ui);padding:8px 10px;text-decoration:none;color:var(--ink-2);transition:color .2s}
.links a::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.links a:hover,.links a.on{color:var(--ink)}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.nav-r{display:flex;gap:8px;flex:none}
.pbtn{height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--slot);box-shadow:inset 2px 2px 0 var(--bev-hi),inset -2px -2px 0 var(--bev-lo);font:500 13px var(--f-ui);color:var(--ink);transition:transform .18s cubic-bezier(.2,.9,.3,1.4)}
.pbtn:hover{transform:translateY(-2px)}
.pbtn:active{transform:translateY(1px) scale(.96)}
.pbtn svg{width:18px;height:18px;flex:none;shape-rendering:crispEdges}
.pbtn .dim{color:var(--ink-3)}
.pbtn.pop{animation:btnpop .45s cubic-bezier(.2,.9,.3,1.6)}
@keyframes btnpop{40%{transform:scale(1.18) rotate(-6deg)}}
.menu-btn{display:none}
.menu{position:absolute;right:16px;top:calc(100% + 30px);background:var(--paper);box-shadow:0 0 0 2px var(--line-2),0 20px 40px -18px rgba(0,0,0,.5);display:grid;min-width:180px;padding:6px}
.menu a{font:500 16px var(--f-ui);padding:10px 14px;text-decoration:none}
.menu a.on{color:var(--accent)}

.xp{position:absolute;left:0;right:0;top:100%;height:24px}
.xp-track{position:absolute;inset:0 0 auto 0;height:7px;background:var(--xp-track);transition:height .22s cubic-bezier(.2,.9,.3,1);overflow:hidden}
.xp:hover .xp-track{height:14px}
.xp-fill{position:absolute;inset:0;background:linear-gradient(90deg,var(--xp-a),var(--xp-b));box-shadow:inset 0 2px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.18);clip-path:inset(0 100% 0 0);overflow:hidden}
.xp-fill i{position:absolute;top:0;bottom:0;width:120px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:glint 3.2s linear infinite}
.xp-seg{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,var(--xp-gap) 22px 24px);pointer-events:none}
.xp-track.flash .xp-fill{animation:xpflash .5s}
.xp-track.gold .xp-fill{background:linear-gradient(90deg,#ffd257,#ffb03a,#ffe9a8)}
@keyframes glint{from{left:-140px}to{left:100%}}
@keyframes xpflash{30%{filter:brightness(2.1)}}
.xp-lv{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:2px 10px 2px 8px;background:var(--tip-bg);color:var(--tip-ink);font:500 12px var(--f-ui);white-space:nowrap;transition:opacity .2s}
.xp-lv b{font:22px/1 var(--f-num);font-weight:400;color:#8cf26a;text-shadow:2px 2px 0 #183410}
.xp:hover .xp-lv{opacity:0}
.xp-marks{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .2s}
.xp:hover .xp-marks{opacity:1;pointer-events:auto}
.xm{position:absolute;top:0;height:14px;width:14px;transform:translateX(-7px)}
.xm::before{content:"";position:absolute;left:6px;top:0;width:2px;height:14px;background:var(--ink)}
.xm span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:500 12px var(--f-ui);padding:2px 7px;background:var(--tip-bg);color:var(--tip-ink);white-space:nowrap;transition:background .15s}
.xm:first-child span{left:0;transform:none}
.xm.last span{left:auto;right:0;transform:none}
.xm:hover span{background:var(--accent);color:var(--accent-ink)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:clamp(600px,92vh,860px);display:flex;align-items:center}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:40px;align-items:center;padding-block:110px 200px;width:100%}
.hello{display:inline-flex;align-items:center;gap:10px;margin:0;padding:6px 12px 6px 6px;background:var(--hud-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 2px var(--line);font:500 15px var(--f-ui);color:var(--ink-2)}
.hello img{width:28px;height:28px}
.hello b{color:var(--ink);font-weight:600}
.hero-tag{margin:22px 0 18px;font:600 clamp(36px,5vw,62px)/1.18 var(--f-pixel);text-wrap:balance;color:var(--ink);text-shadow:3px 3px 0 var(--halo)}
:root[lang="zh-CN"] .hero-tag{font-weight:400;font-size:48px;line-height:1.35;letter-spacing:.02em;font-synthesis:none}
.hero-tag em{font-style:normal;color:var(--accent);display:inline-block}
.hero-tag .ch{display:inline-block;animation:chIn .7s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--k) * 28ms)}
@keyframes chIn{from{transform:translateY(-14px);opacity:.15}to{transform:none;opacity:1}}
.hero-sub{margin:0 0 26px;max-width:46ch;color:var(--ink-2);font-size:17px;text-shadow:0 1px 0 var(--halo),0 0 12px var(--halo)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;font:600 15px var(--f-ui);padding:12px 18px;background:var(--accent);color:var(--accent-ink);text-decoration:none;box-shadow:inset 3px 3px 0 rgba(255,255,255,.28),inset -3px -3px 0 rgba(0,0,0,.22);transition:transform .2s cubic-bezier(.2,.9,.3,1.4),filter .2s;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.btn:hover{transform:translateY(-3px);filter:brightness(1.06)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:var(--slot);color:var(--ink);box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo)}
.btn.off{opacity:.5;cursor:not-allowed}
.btn.off:hover{transform:none}
.btn.sm{font-size:13px;padding:8px 12px}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.hud-i{display:flex;align-items:baseline;gap:8px;padding:6px 12px;background:var(--hud-bg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 2px var(--line)}
.hud-i b{font:24px/1 var(--f-num);font-weight:400;font-variant-numeric:tabular-nums}
.hud-i span{font:500 12px var(--f-ui);color:var(--ink-2)}
.hero-av{display:grid;justify-items:center;gap:14px}
.av{position:relative;width:min(240px,100%);aspect-ratio:1;max-width:100%;padding:8px;background:var(--slot);box-shadow:inset 4px 4px 0 var(--bev-hi),inset -4px -4px 0 var(--bev-lo),0 0 0 3px var(--accent),0 24px 44px -18px var(--accent);animation:bob 4.2s ease-in-out infinite;transition:box-shadow .9s}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.av::after{content:"";position:absolute;top:12px;right:12px;width:10px;height:10px;background:var(--accent);box-shadow:0 0 0 2px var(--slot)}
.av-shadow{width:46%;height:10px;background:rgba(0,0,0,.2);animation:shadow 4.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}
@keyframes shadow{50%{transform:scaleX(.8);opacity:.6}}
.dig{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:grid;justify-items:center;gap:4px;text-decoration:none;font:500 13px var(--f-ui);color:var(--ink);padding:6px 12px;background:var(--hud-bg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dig svg{width:16px;height:16px;animation:digb 1.6s ease-in-out infinite;shape-rendering:crispEdges}
@keyframes digb{50%{transform:translateY(4px)}}

/* ---------- stages (sections floating over the world) ---------- */
.stage{position:relative;padding-top:clamp(170px,34vh,340px)}
.panel-big{position:relative;padding:38px 36px 36px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);box-shadow:inset 0 0 0 2px var(--line),inset 0 4px 0 var(--rim),var(--shadow)}
.panel-big::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent));background-size:200% 100%;animation:strip 6s linear infinite}
@keyframes strip{to{background-position:-200% 0}}
.sec-head{display:grid;gap:12px;margin-bottom:30px}
.sec-t{display:flex;align-items:center;gap:16px}
.sec-ico{flex:none;width:52px;height:52px;display:grid;place-items:center;background:var(--slot);box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 2px var(--accent);animation:icoBob 3.6s ease-in-out infinite}
@keyframes icoBob{50%{transform:translateY(-4px) rotate(-3deg)}}
.sec-ico img{width:34px;height:34px}
.sec-title{margin:0;font:700 clamp(34px,4.6vw,52px)/1 var(--f-pixel);text-wrap:balance}
:root[lang="zh-CN"] .sec-title{font-weight:400;font-size:48px;font-synthesis:none}
.lede{margin:0;max-width:60ch;color:var(--ink-2)}

/* ---------- portfolio ---------- */
.r-common{--rc:var(--r-common);--tc:var(--t-common)}
.r-uncommon{--rc:var(--r-uncommon);--tc:var(--t-uncommon)}
.r-rare{--rc:var(--r-rare);--tc:var(--t-rare)}
.r-epic{--rc:var(--r-epic);--tc:var(--t-epic)}
.r-legendary{--rc:var(--r-legendary);--tc:var(--t-legendary)}
.pf-bar{display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap;margin-bottom:26px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--f-ui);padding:7px 12px;color:var(--ink-2);background:var(--glass-2);box-shadow:inset 0 0 0 2px var(--line-2);transition:background-color .2s,color .2s,transform .2s}
.tab b{font:18px/1 var(--f-num);font-weight:400;color:var(--ink-3)}
.tab:hover{color:var(--ink);transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--inv-ink);box-shadow:none}
.tab[aria-selected="true"] b{color:inherit;opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:500 12px var(--f-ui);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;background:var(--rc)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:26px 18px;padding:24px;background:var(--glass-2);box-shadow:inset 0 0 0 2px var(--line)}
.item{display:grid;justify-items:center;align-content:start;gap:10px;text-align:center;min-width:0}
.item:focus-visible{outline:none}
.item:focus-visible .slot{outline:3px solid var(--accent);outline-offset:4px}
.slot{position:relative;width:100%;max-width:120px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;background:var(--slot);box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 2px color-mix(in srgb,var(--rc) 55%,transparent);transition:transform .32s cubic-bezier(.2,.9,.3,1.35),box-shadow .32s}
.slot::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--rc);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.slot img{width:58%;height:58%;transition:transform .36s cubic-bezier(.2,.9,.3,1.45)}
.item:hover .slot,.item:focus-visible .slot{transform:translateY(-7px);box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 2px var(--rc),0 18px 30px -12px var(--rc)}
.item:hover .slot img{transform:scale(1.14) rotate(-7deg)}
.r-legendary .slot::before,.r-epic .slot::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,236,170,.6) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 4.6s ease-in-out infinite}
.r-epic .slot::before{background:linear-gradient(115deg,transparent 38%,rgba(220,190,255,.45) 50%,transparent 62%);animation-delay:1.7s;animation-duration:6s}
@keyframes sheen{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
.item-name{font:600 14px/1.3 var(--f-ui);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;text-wrap:balance}
.item-type{margin-top:-6px;font:10px var(--f-hud);letter-spacing:.05em;color:var(--ink-3)}
.inv.anim .item{animation:itemIn .45s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i) * 35ms)}
@keyframes itemIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}

/* ---------- tooltip ---------- */
.tip{position:fixed;left:0;top:0;z-index:80;pointer-events:none;width:max-content;max-width:min(330px,calc(100vw - 24px));visibility:hidden;opacity:0;will-change:transform}
.tip.on{visibility:visible;opacity:1;animation:tipIn .22s cubic-bezier(.2,.9,.3,1)}
@keyframes tipIn{from{clip-path:inset(46% 46% 46% 46%)}to{clip-path:inset(0)}}
.tip-frame{padding:2px;background:linear-gradient(160deg,var(--tc),color-mix(in srgb,var(--tc) 25%,#170f2c) 70%);clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.tip-body{background:var(--tip-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--tip-ink);padding:12px 14px;font:14px/1.5 var(--f-body);clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px)}
.tip.on .tip-body>*{animation:fadeUp .26s .07s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.tn{font:600 17px/1.25 var(--f-ui);color:var(--tc)}
.tn.shine{background:linear-gradient(90deg,#ffcb5a,#fff3c4,#ffad33,#ffcb5a);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.6s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
.tt{margin-top:2px;font:500 12px var(--f-ui);color:var(--tip-dim)}
.tsep{height:2px;margin:9px 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 4px,transparent 4px 8px)}
.ts{display:flex;justify-content:space-between;align-items:baseline;gap:18px}
.ts span{color:var(--tip-dim);font-size:13px}
.ts b{font:20px/1.1 var(--f-num);font-weight:400;color:#9fd0ff;font-variant-numeric:tabular-nums}
.tl{display:flex;gap:8px;font-size:13px;line-height:1.45;margin-top:4px}
.tl::before{content:"";flex:none;width:6px;height:6px;margin-top:6px;background:var(--tc)}
.td{margin-top:8px;font-size:13px;color:var(--tip-dim)}
:root[lang="en"] .td{font-style:italic}
.tauth{font-size:13px;color:var(--tip-ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tags span{font:10px/1 var(--f-hud);letter-spacing:.04em;padding:4px 6px;background:rgba(255,255,255,.09);color:var(--tip-ink)}
.tags .tsm{background:rgba(255,203,90,.18);color:#ffdb8a}
.th{margin-top:9px;font:500 11px var(--f-ui);color:var(--tip-dim)}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:85;display:grid;gap:10px;animation:sheetIn .32s cubic-bezier(.2,.9,.3,1.1)}
.sheet .tip-body{max-height:58vh;overflow:auto}
.sheet-act{display:flex;gap:10px}
.sheet-act .btn{flex:1;justify-content:center}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

/* ---------- notes ---------- */
.ncards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px;perspective:900px}
.ncard{position:relative;display:grid;gap:12px;align-content:start;padding:22px 22px 20px;min-width:0;background:var(--glass-2);box-shadow:inset 0 0 0 2px var(--line);transition:transform .25s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s;transform-style:preserve-3d}
.ncard::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.35),transparent 60%);opacity:0;transition:opacity .3s}
.ncard:hover::after{opacity:1}
.ncard:hover{box-shadow:inset 0 0 0 2px var(--accent),0 22px 36px -22px rgba(0,0,0,.55)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:19px/1 var(--f-num);color:var(--ink-3)}
.ncard h3{margin:0;font:600 20px/1.4 var(--f-ui);text-wrap:balance}
.ncard p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.65}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font:500 11px/1 var(--f-ui);padding:5px 7px;background:var(--chip);color:var(--ink-2)}
.go{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--f-ui);color:var(--accent)}
.go svg{width:14px;height:14px;transition:transform .25s;shape-rendering:crispEdges}
.ncard:hover .go svg{transform:translateX(5px)}

/* ---------- feed ---------- */
.feed{position:relative;max-width:780px;display:grid;gap:14px;padding-left:30px;margin:0;list-style:none}
.feed::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:3px;background:repeating-linear-gradient(180deg,var(--line-2) 0 6px,transparent 6px 11px);animation:rail 1.2s linear infinite}
@keyframes rail{to{background-position:0 11px}}
.fi{position:relative;display:grid;gap:6px;padding:14px 18px;background:var(--glass-2);box-shadow:inset 0 0 0 2px var(--line);transition:transform .3s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s}
.fi:hover{transform:translateX(6px);box-shadow:inset 0 0 0 2px var(--fc)}
.fi::before{content:"";position:absolute;left:-28px;top:19px;width:12px;height:12px;background:var(--fc);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),0 0 0 3px var(--glass)}
.fi:first-child::after{content:"";position:absolute;left:-31px;top:16px;width:18px;height:18px;box-shadow:0 0 0 2px var(--fc);animation:ring 1.8s ease-out infinite}
.fi-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fi time{font:19px/1 var(--f-num);color:var(--ink-3);font-variant-numeric:tabular-nums}
.ftag{font:500 11px/1 var(--f-ui);padding:4px 6px;color:var(--ink);background:color-mix(in srgb,var(--fc) 26%,transparent)}
.fi p{margin:0}

/* ---------- progress tree ---------- */
.tree-top{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;margin-bottom:14px}
.tleg{display:flex;gap:16px;flex-wrap:wrap;font:500 12px var(--f-ui);color:var(--ink-2)}
.tleg span{display:inline-flex;gap:6px;align-items:center}
.tleg i{width:10px;height:10px;box-shadow:inset 0 0 0 2px var(--nc)}
.tstat{font:20px/1 var(--f-num);color:var(--ink-2)}
.tree-view{position:relative;height:480px;max-height:72vh;overflow:auto;background:var(--glass-2);box-shadow:inset 0 0 0 2px var(--line);cursor:grab;overscroll-behavior:contain;scrollbar-width:thin}
.tree-view.drag{cursor:grabbing}
.tree{position:relative;width:1110px;height:470px;user-select:none;-webkit-user-select:none;background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:30px 30px;background-position:-1px -1px}
.tree svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ln{fill:none;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter}
.ln.done{stroke:var(--accent)}
.ln.prog{stroke:var(--r-legendary);stroke-dasharray:8 6;animation:dash 1s linear infinite}
.ln.locked{stroke:var(--line-2);stroke-dasharray:4 6}
@keyframes dash{to{stroke-dashoffset:-14}}
.node{position:absolute;width:60px;height:60px}
.nbox{width:60px;height:60px;display:grid;place-items:center;position:relative;background:var(--slot);box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 2px var(--nc);transition:transform .28s cubic-bezier(.2,.9,.3,1.4)}
.node:hover .nbox,.node:focus-visible .nbox{transform:scale(1.12) rotate(-3deg)}
.node:focus-visible{outline:none}
.node:focus-visible .nbox{outline:3px solid var(--accent);outline-offset:4px}
.nbox img{width:36px;height:36px}
.nl{position:absolute;top:70px;left:50%;width:130px;transform:translateX(-50%);text-align:center;font:500 13px/1.3 var(--f-ui);color:var(--ink-2)}
.node.done{--nc:var(--accent)}
.node.done .nbox{box-shadow:inset 3px 3px 0 var(--bev-hi),inset -3px -3px 0 var(--bev-lo),0 0 0 2px var(--nc),0 0 22px -6px var(--accent)}
.node.prog{--nc:var(--r-legendary)}
.node.prog .nbox::after{content:"";position:absolute;inset:-2px;box-shadow:0 0 0 2px var(--r-legendary);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.node.locked{--nc:var(--line-2)}
.node.locked img{filter:grayscale(1);opacity:.4}
.node.locked .nl{color:var(--ink-3)}
.lock{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;padding:3px;background:var(--tip-bg);color:var(--tip-ink)}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:grid;gap:20px;min-width:0}
.panel{display:grid;gap:14px;align-content:start;padding:22px;min-width:0;background:var(--glass-2);box-shadow:inset 0 0 0 2px var(--line)}
.panel h3{margin:0;font:600 14px var(--f-ui);color:var(--ink-3)}
.panel>p{margin:0}
.intro{font-size:17px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;margin:0}
.kv dt{font:600 14px/1.7 var(--f-ui);color:var(--ink-3)}
.kv dd{margin:0}
.contact{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;background:var(--chip)}
.crow b{font:600 14px var(--f-ui)}
.crow span{overflow-wrap:anywhere;color:var(--ink-2);font-size:14px}
.crow .mail{font:500 15px var(--f-mono);color:var(--ink)}
.crow .tbd{color:var(--ink-3)}
.achg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:16px 10px}
.ach{display:grid;justify-items:center;gap:8px;text-align:center}
.ach .nbox{width:52px;height:52px;--nc:var(--r-legendary)}
.ach .nbox img{width:32px;height:32px}
.ach.off .nbox{--nc:var(--line-2)}
.ach.off img{filter:grayscale(1);opacity:.35}
.ach small{font:500 12px/1.3 var(--f-ui);color:var(--ink-2)}
.ach.off small{color:var(--ink-3)}
.ach.new .nbox{animation:achNew 1.2s cubic-bezier(.2,.9,.3,1.4)}
@keyframes achNew{30%{transform:scale(1.3) rotate(8deg)}}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.friend{display:grid;gap:2px;padding:12px;box-shadow:inset 0 0 0 2px var(--line-2);background-image:repeating-linear-gradient(45deg,var(--chip) 0 6px,transparent 6px 12px)}
.friend b{font:600 14px var(--f-ui)}
.friend span{font-size:12px;color:var(--ink-3)}

/* ---------- footer ---------- */
.bedrock{padding-top:clamp(160px,30vh,300px);padding-bottom:24px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap;padding:20px 24px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 2px var(--line),var(--shadow)}
.foot p{margin:0;font-size:14px}
.foot-note{font-size:13px;color:var(--ink-3)}

/* ---------- modal ---------- */
.modal{border:0;padding:0;width:min(900px,calc(100vw - 32px));max-width:none;max-height:min(88vh,920px);background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px var(--line-2),0 40px 90px -30px rgba(0,0,0,.65);overflow:hidden}
.modal[open]{animation:pop .34s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.modal::backdrop{background:rgba(8,10,20,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-in{max-height:min(88vh,920px);overflow:auto;padding:36px 32px 32px}
.x{position:absolute;top:12px;right:12px;z-index:2}
.det{display:grid;grid-template-columns:200px minmax(0,1fr);gap:34px}
.det-side{display:grid;gap:14px;align-content:start;justify-items:start}
.det-slot{width:100%;max-width:200px;aspect-ratio:1;display:grid;place-items:center;background:var(--slot);box-shadow:inset 4px 4px 0 var(--bev-hi),inset -4px -4px 0 var(--bev-lo),0 0 0 3px var(--rc),0 22px 40px -18px var(--rc)}
.det-slot img{width:62%;height:62%;animation:float 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(-3deg)}}
.rbadge{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--f-ui);padding:5px 9px;background:color-mix(in srgb,var(--rc) 18%,transparent);color:var(--ink)}
.rbadge i{width:9px;height:9px;background:var(--rc)}
.det-main{display:grid;gap:18px;align-content:start;min-width:0}
.det-title{margin:4px 0 0;font:700 clamp(26px,3.6vw,38px)/1.2 var(--f-pixel);text-wrap:balance}
:root[lang="zh-CN"] .det-title,:root[lang="zh-CN"] .reader h2{font-weight:400;font-size:36px;font-synthesis:none}
.det-main>p{margin:0}
.det h4{margin:0 0 10px;font:600 13px var(--f-ui);color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{padding:10px 12px;background:var(--chip)}
.stat b{display:block;font:28px/1 var(--f-num);font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font:500 12px var(--f-ui);color:var(--ink-3)}
.hp{position:relative;height:24px;background:#2a1517;box-shadow:inset 0 0 0 3px rgba(0,0,0,.45)}
.hp-fill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(100% - 6px);background:linear-gradient(180deg,#ff7a66,#c8322a);box-shadow:inset 0 3px 0 rgba(255,255,255,.3);transition:width .7s cubic-bezier(.2,.9,.3,1)}
.hp-div{position:absolute;top:0;bottom:0;width:3px;background:rgba(0,0,0,.6)}
.hp-num{position:absolute;inset:0;display:grid;place-items:center;font:19px/1 var(--f-num);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ph{font:500 13px var(--f-ui);padding:6px 10px;box-shadow:inset 0 0 0 2px var(--line-2)}
.ph[aria-pressed="true"]{background:var(--ink);color:var(--inv-ink);box-shadow:none}
.ph-d{margin:10px 0 0;color:var(--ink-2)}
.lines{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.lines li{display:flex;gap:10px}
.lines li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;background:var(--rc)}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gal div{aspect-ratio:16/10;display:grid;place-items:center;font:500 12px var(--f-ui);color:var(--ink-3);box-shadow:inset 0 0 0 2px var(--line-2);background-image:repeating-linear-gradient(45deg,var(--chip) 0 8px,transparent 8px 16px)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.bib{margin:0;padding:14px 16px;overflow:auto;background:var(--code);box-shadow:inset 0 0 0 2px var(--line);font:12.5px/1.6 var(--f-mono);white-space:pre}
.auth b{font-weight:600;color:var(--accent)}
.reader{max-width:68ch;margin-inline:auto}
.reader h2{margin:10px 0 24px;font:700 clamp(26px,3.6vw,36px)/1.3 var(--f-pixel);text-wrap:balance}
.prose p,.prose ul{margin:0 0 1.1em}
.prose ul{padding-left:1.2em}
.prose li{margin-bottom:.4em}
.prose code{font:.9em var(--f-mono);background:var(--chip);padding:1px 5px}
.code{position:relative;margin:0 0 1.2em;padding:38px 16px 16px;background:var(--code);box-shadow:inset 0 0 0 2px var(--line);overflow:auto}
.code code{background:none;padding:0;font:13px/1.65 var(--f-mono);white-space:pre}
.code-lang{position:absolute;top:10px;left:14px;font:10px var(--f-hud);letter-spacing:.06em;color:var(--ink-3)}
.code .pbtn{position:absolute;top:6px;right:6px;height:26px;font-size:11px}

/* ---------- toasts, particles ---------- */
.toasts{position:fixed;right:16px;top:calc(92px + env(safe-area-inset-top,0px));z-index:90;display:grid;gap:10px;justify-items:end;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 18px 10px 10px;background:var(--tip-bg);color:var(--tip-ink);box-shadow:0 0 0 2px #ffcb5a,0 16px 30px -12px rgba(0,0,0,.6);animation:tin .55s cubic-bezier(.2,.9,.3,1.25)}
.toast.mini{box-shadow:0 0 0 2px var(--t-uncommon),0 16px 30px -12px rgba(0,0,0,.6);padding:10px 14px;font:600 14px var(--f-ui)}
.toast.out{animation:tout .35s forwards}
.toast img{width:40px;height:40px;padding:4px;background:rgba(255,255,255,.07);animation:tico .8s .2s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes tico{from{transform:scale(.4) rotate(-30deg)}to{transform:none}}
.toast small{display:block;font:500 11px var(--f-ui);color:#ffcb5a;letter-spacing:.03em}
.toast b{display:block;font:600 16px var(--f-ui)}
.toast span{display:block;font-size:12px;color:var(--tip-dim)}
@keyframes tin{from{transform:translateX(120%)}to{transform:none}}
@keyframes tout{to{transform:translateX(120%);opacity:0}}
.pt svg{display:block;width:100%;height:100%}
.pt{position:fixed;left:0;top:0;width:6px;height:6px;z-index:96;pointer-events:none}
.fb{position:fixed;top:-40px;width:28px;height:28px;z-index:95;pointer-events:none;box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),inset -3px -3px 0 rgba(0,0,0,.28)}
.wipe{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),transparent 0,transparent var(--r),var(--wc) calc(var(--r) + 2px));opacity:0}

/* ---------- horizontal journey ---------- */
html,body{height:100%}
body{overflow:hidden;overscroll-behavior:none;touch-action:none}
body.dragging,body.dragging *{cursor:grabbing!important}
.hero{position:fixed;inset:0;z-index:5;pointer-events:none;min-height:0;display:flex;align-items:center}
.hero-in{padding-block:80px 170px;will-change:transform,opacity}
.hero-in .hello,.hero-in .cta,.hero-in .hud,.hero-in .av{pointer-events:auto}
.dig{position:fixed;z-index:12;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;transition:opacity .45s}
.dig svg{animation:digr 1.4s ease-in-out infinite}
@keyframes digr{50%{transform:translateX(5px)}}
#cards{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.card{position:absolute;left:0;top:0;width:min(290px,78vw);pointer-events:auto;cursor:pointer;outline:none;will-change:transform}
.card .float{position:relative;animation:cardBob 4.4s ease-in-out infinite;animation-delay:calc(var(--d) * -.9s)}
@keyframes cardBob{50%{transform:translateY(-8px)}}
.card-in{position:relative;display:grid;gap:12px;padding:20px 18px 20px;background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);box-shadow:inset 0 0 0 2px var(--line),inset 0 4px 0 var(--rim),var(--shadow);transform-origin:50% 100%;transition:transform .42s cubic-bezier(.2,.9,.3,1.35),box-shadow .42s;overflow:hidden}
.card-in::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent));background-size:200% 100%;animation:strip 6s linear infinite}
.card:hover .card-in,.card:focus-visible .card-in{transform:scale(1.1) translateY(-10px);box-shadow:inset 0 0 0 2px var(--accent),inset 0 4px 0 var(--rim),0 34px 70px -26px var(--accent)}
.card:focus-visible .card-in{outline:3px solid var(--accent);outline-offset:4px}
.card.open{visibility:hidden!important}
.card-h{display:flex;align-items:center;gap:12px}
.card-h .sec-ico{width:44px;height:44px;animation:none}
.card-h .sec-ico img{width:28px;height:28px}
.card:hover .card-h .sec-ico{animation:icoBob 1.2s ease-in-out infinite}
.card-h h3{margin:0;font:700 24px/1.1 var(--f-pixel)}
:root[lang="zh-CN"] .card-h h3{font-weight:400;font-synthesis:none}
.card-h small{display:block;margin-top:3px;font:500 12px var(--f-ui);color:var(--ink-3)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini img{width:34px;height:34px;padding:4px;background:var(--slot);box-shadow:inset 2px 2px 0 var(--bev-hi),inset -2px -2px 0 var(--bev-lo);transition:transform .3s cubic-bezier(.2,.9,.3,1.5)}
.card:hover .mini img{transform:translateY(-3px)}
.card:hover .mini img:nth-child(2){transition-delay:.04s}.card:hover .mini img:nth-child(3){transition-delay:.08s}.card:hover .mini img:nth-child(4){transition-delay:.12s}.card:hover .mini img:nth-child(5){transition-delay:.16s}.card:hover .mini img:nth-child(6){transition-delay:.2s}
.cnum{margin:0;display:flex;align-items:baseline;gap:6px;font:500 13px var(--f-ui);color:var(--ink-2)}
.cnum b{font:24px/1 var(--f-num);font-weight:400;color:var(--ink)}
.ctext{margin:0;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdate{margin:0;font:18px/1 var(--f-num);color:var(--ink-3)}
.cbar{height:10px;background:var(--chip);box-shadow:inset 0 0 0 2px var(--line)}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp-a),var(--xp-b))}
.cme{display:flex;gap:12px;align-items:center;min-width:0}
.cme img{width:44px;height:44px;flex:none}
.cme b{display:block;font:600 15px var(--f-ui)}
.cme span{display:block;font:13px var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
.dwell{position:absolute;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.card.dwelling .dwell{width:100%;transition:width var(--dw,.9s) linear}
.tether{position:absolute;left:50%;top:100%;width:4px;margin-left:-2px;height:var(--th,40px);background:repeating-linear-gradient(180deg,var(--ink-3) 0 4px,transparent 4px 8px);opacity:.5;pointer-events:none}
#veil{position:fixed;inset:0;z-index:20;background:rgba(8,12,28,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .45s}
#veil.on{opacity:1;pointer-events:auto}
.xpanel{position:fixed;left:50%;top:calc(50% + 28px);z-index:30;width:min(1060px,calc(100vw - 32px));max-height:calc(100% - 128px);overflow:auto;transform:translate(-50%,-50%);overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin}
.xclose{position:sticky;top:0;float:right;z-index:3;margin:-16px -14px 0 12px}
.xpanel .foot{margin-top:20px;background:var(--glass-2);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 2px var(--line)}
.xpanel .tree-view{touch-action:pan-x pan-y}
@media (max-width:560px){.xpanel{max-height:calc(100% - 96px);top:calc(50% + 22px);width:calc(100vw - 20px)}.card-h h3{font-size:20px}.hero-in{padding-block:76px 150px}}


/* ---------- v5 tweaks ---------- */
.xp-lv b{display:none}
.xp-lv{padding:3px 10px}
.logo-mark{padding:0;overflow:hidden;box-shadow:inset 2px 2px 0 var(--bev-hi),inset -2px -2px 0 var(--bev-lo),0 0 0 2px var(--accent)}
.logo-mark img{width:100%;height:100%;object-fit:cover;display:block}
.hero-in{grid-template-columns:minmax(0,1fr)}
.hero-txt{max-width:600px}
:root .hero-tag.latin{font-family:var(--tag-font);font-weight:var(--tag-w,700);font-size:calc(clamp(44px,6vw,80px) * var(--tag-scale,1));line-height:1.05;letter-spacing:-.01em;margin:0 0 22px;color:var(--tag-ink,var(--ink));text-shadow:var(--tag-sh);transition:color .6s}
.hero-tag.latin em .ch{background:var(--tag-grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:var(--tag-drop);animation:chIn .7s cubic-bezier(.2,.9,.3,1.3) both,tagSlide 6s linear infinite;animation-delay:calc(var(--k) * 28ms),0s}
@keyframes tagSlide{to{background-position:-220% 0}}
:root[data-biome=cherry] .hero-tag .ch{animation:chIn .7s cubic-bezier(.2,.9,.3,1.3) both,petal 5s ease-in-out infinite;animation-delay:calc(var(--k) * 28ms),calc(var(--k) * -.6s)}
:root[data-biome=cherry] .hero-tag em .ch{animation:chIn .7s both,tagSlide 7s linear infinite,petal 5s ease-in-out infinite;animation-delay:calc(var(--k) * 28ms),0s,-1s}
@keyframes petal{50%{transform:translateY(-6px) rotate(-2deg)}}
:root[data-biome=snow] .hero-tag em .ch{animation:chIn .7s both,tagSlide 3.2s linear infinite;animation-delay:calc(var(--k) * 28ms),0s}
:root[data-biome=desert] .hero-tag .ch{animation:chIn .7s cubic-bezier(.2,.9,.3,1.3) both,heat 2.6s ease-in-out infinite;animation-delay:calc(var(--k) * 28ms),calc(var(--k) * -.4s)}
@keyframes heat{25%{transform:skewX(3deg) translateX(1px)}75%{transform:skewX(-3deg) translateX(-1px)}}
:root[data-biome=ocean] .hero-tag .ch{animation:chIn .7s cubic-bezier(.2,.9,.3,1.3) both,wave 2.8s ease-in-out infinite;animation-delay:calc(var(--k) * 28ms),calc(var(--k) * -.35s)}
:root[data-biome=ocean] .hero-tag em .ch{animation:chIn .7s both,wave 2.8s ease-in-out infinite,tagSlide 6s linear infinite;animation-delay:calc(var(--k) * 28ms),calc(var(--k) * -.35s),0s}
@keyframes wave{50%{transform:translateY(-7px)}}
:root[data-biome=nether] .hero-tag em .ch{background-size:100% 260%;animation:chIn .7s both,lava 2.2s ease-in-out infinite,flick 1.7s steps(1) infinite;animation-delay:calc(var(--k) * 28ms),0s,0s}
@keyframes lava{50%{background-position:0 100%}}
@keyframes flick{0%,100%{opacity:1}42%{opacity:.82}46%{opacity:1}71%{opacity:.9}}
:root[data-biome=end] .hero-tag .ch{animation:chIn .7s cubic-bezier(.2,.9,.3,1.3) both,drift 6s ease-in-out infinite;animation-delay:calc(var(--k) * 28ms),calc(var(--k) * -1.3s)}
:root[data-biome=end] .hero-tag em .ch{animation:chIn .7s both,tagSlide 4s linear infinite,drift 6s ease-in-out infinite;animation-delay:calc(var(--k) * 28ms),0s,-2s}
@keyframes drift{33%{transform:translate(2px,-5px)}66%{transform:translate(-2px,3px)}}

.hero-lead{max-width:34em}
.hero-lead{margin:0 0 24px;font:500 clamp(20px,2.2vw,26px)/1.55 var(--f-ui);color:var(--ink);text-shadow:0 2px 0 var(--halo),0 0 18px var(--halo);text-wrap:balance}
:root[data-dim] .hero-in,:root[data-dim] .dig{--ink:#f4eefc;--ink-2:#dcd2ea;--halo:rgba(6,2,14,.7);--hud-bg:rgba(24,12,34,.62);--line:rgba(255,255,255,.14);--slot:#2a2236;--bev-hi:rgba(255,255,255,.1);--bev-lo:rgba(0,0,0,.45);color:var(--ink)}
:root[data-dim] .nav{background:var(--nav);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
/* ---------- v6 layout ---------- */
.xp-lv{display:none!important}
.links a{font-size:16px}
/* hero */
.hero-in{padding-block:90px 180px}
.hero-tag.latin{margin-bottom:28px!important}
.cta{gap:12px}
.cta .btn{padding:13px 20px;font-size:16px}
.hud{display:inline-flex;flex-wrap:wrap;gap:0;margin-top:22px;background:var(--hud-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 2px var(--line)}
.hud-i{display:flex;align-items:baseline;gap:8px;padding:10px 16px;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-left:2px solid var(--line);transition:background-color .2s}
.hud-i:first-child{border-left:0}
.hud-i:hover{background:var(--chip)}
.hud-i b{font:28px/1 var(--f-num);font-weight:400;color:var(--ink)}
.hud-i span{font:500 13px var(--f-ui);color:var(--ink-2)}
/* cards */
.card{width:min(320px,80vw)}
.card-in{padding:22px 20px 22px;gap:14px}
.card-h h3{font-size:28px}
.card-h small{font-size:13px}
.dwell{height:5px}
/* panels */
.xpanel{padding-top:0}
.xpanel::before{display:none}
#notes.xpanel,#about.xpanel{width:min(1000px,calc(100vw - 32px))}
#feed.xpanel{width:min(840px,calc(100vw - 32px))}
.xpanel .feed{max-width:none}
.pbar{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;gap:14px 24px;flex-wrap:wrap;margin:0 -36px 26px;padding:32px 36px 18px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 2px 0 var(--line)}
.pbar::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent));background-size:200% 100%;animation:strip 6s linear infinite}
.pbar .sec-t{align-items:flex-start;min-width:0;flex:1 1 320px}
.sec-tt{display:grid;gap:8px;min-width:0}
.pbar .lede{font-size:15px;max-width:52ch}
.pbar-r{display:flex;gap:8px;flex:none;margin-left:auto;align-items:center}
.pn span{max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn svg,.pclose svg{width:14px;height:14px}
.pclose{min-width:40px}
#notes .ncards{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.toasts{top:auto;bottom:calc(24px + env(safe-area-inset-bottom,0px))}
/* about */
.prof{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 20px;margin-bottom:20px;background:var(--glass-2);box-shadow:inset 0 0 0 2px var(--line)}
.prof img{width:64px;height:64px;flex:none;box-shadow:0 0 0 3px var(--accent)}
.prof-t{display:grid;gap:6px;min-width:0}
.prof-t b{font:700 26px/1.1 var(--f-pixel)}
.ptags{display:flex;gap:6px;flex-wrap:wrap}
.ptags span{font:500 12px/1 var(--f-ui);padding:5px 8px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.prof-m{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prof-m .mail{font:500 15px var(--f-mono);color:var(--ink)}
.intro.ph{color:var(--ink-3);padding:14px;box-shadow:inset 0 0 0 2px var(--line-2);background-image:repeating-linear-gradient(45deg,var(--chip) 0 6px,transparent 6px 12px)}
@media (max-width:560px){
  .pbar{margin:0 -16px 18px;padding:22px 16px 12px;flex-wrap:nowrap;align-items:center}
  .pbar .sec-t{flex:1 1 auto;align-items:center}
  .pbar .lede{display:none}
  .pbar .sec-ico{width:40px;height:40px}
  .pbar .sec-ico img{width:26px;height:26px}
  .pn span{display:none}
  .pn{min-width:36px;padding:0 8px}
  .hud{display:grid;grid-template-columns:1fr 1fr}
  .hud-i{padding:8px 12px}
  .hud-i:nth-child(3){border-left:0}
  .hud-i:nth-child(n+3){border-top:2px solid var(--line)}
  .hud-i b{font-size:24px}
  .prof-m{margin-left:0}
  .toasts{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:12px;left:12px;justify-items:center}

@media (min-width:960px){

/* ---------- v19: advancements board ---------- */
.adv-top{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;margin-bottom:14px}
.adv-leg{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;font:500 13px var(--f-ui);color:var(--ink-2)}
.adv-leg span{display:inline-flex;align-items:center;gap:7px}
.adv-leg .sep{width:2px;height:16px;background:var(--line-2)}
.lg{width:16px;height:16px;background:#e8b43a;display:inline-block}
.lg.goal{clip-path:polygon(4px 0,12px 0,16px 4px,16px 12px,12px 16px,4px 16px,0 12px,0 4px)}
.lg.challenge{clip-path:polygon(50% 0,64% 22%,100% 18%,78% 50%,100% 82%,64% 78%,50% 100%,36% 78%,0 82%,22% 50%,0 18%,36% 22%);background:#b06cff}
.ls{width:12px;height:12px;display:inline-block}
.ls.done{background:#e8b43a}.ls.prog{background:#e8b43a;animation:ckPulse 1.4s steps(2) infinite}.ls.locked{background:#7a7f8c}
.adv-xp{display:flex;align-items:center;gap:10px}
.adv-lv{font:500 13px var(--f-ui);color:var(--ink-3)}
.adv-bar{position:relative;width:180px;height:12px;background:#1b1d22;box-shadow:inset 0 0 0 2px #000,0 0 0 2px var(--line-2)}
.adv-bar i{position:absolute;left:2px;top:2px;bottom:2px;max-width:calc(100% - 4px);background:linear-gradient(180deg,#b8ff6a 0 40%,#6fd63f 40%);box-shadow:inset 0 -2px 0 #3f9a28}
.adv-xp b{font:400 26px/1 var(--f-num);color:#7ee86a;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.adv-xp b small{font-size:18px;color:var(--ink-3);text-shadow:none}
.adv-view{height:min(640px,calc(100vh - 262px));min-height:380px;max-height:none;background:var(--adv-tile) 0 0/48px 48px;box-shadow:inset 0 0 0 3px #0d0e12,inset 0 0 60px rgba(0,0,0,.35)}
.adv-tree{background:none!important}
.adv-tree svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lane{position:absolute;left:0;right:0;background:linear-gradient(90deg,color-mix(in srgb,var(--lc) 26%,transparent),color-mix(in srgb,var(--lc) 8%,transparent) 40%,transparent);box-shadow:inset 0 2px 0 color-mix(in srgb,var(--lc) 45%,transparent),inset 0 -2px 0 color-mix(in srgb,var(--lc) 25%,transparent)}
.lane-t{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;font:700 14px var(--f-pixel);color:#fff;background:rgba(10,12,18,.72);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--lc) 80%,transparent),3px 3px 0 rgba(0,0,0,.35);white-space:nowrap}
.lane-t img{width:24px;height:24px}
.era{position:absolute;top:12px;height:26px;display:flex;align-items:center;justify-content:center;font:600 13px var(--f-ui);color:#fff;background:rgba(10,12,18,.6);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);letter-spacing:.04em}
.era::before,.era::after{content:"";position:absolute;bottom:-8px;width:2px;height:8px;background:rgba(255,255,255,.3)}
.era::before{left:0}.era::after{right:0}
.al-o{fill:none;stroke:#0d0e12;stroke-width:10;stroke-linecap:square;stroke-linejoin:miter}
.al-i{fill:none;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter}
.al-i.done{stroke:#f4f1e6}
.al-i.prog{stroke:#e8b43a;stroke-dasharray:8 6;animation:dash 1s linear infinite}
.al-o.locked{stroke:rgba(13,14,18,.7);stroke-width:8}
.al-i.locked{stroke:#7a7f8c;stroke-dasharray:4 6;stroke-width:3}
.node.adv{position:absolute;padding:0;background:none;--rim:#e8b43a;--slotc:#2a2e39}
.node.adv.locked{--rim:#7a7f8c}
.node.adv.challenge.done{--rim:#b06cff}
.node.adv .af{position:absolute;inset:0;display:grid;place-items:center;background:var(--rim);transition:transform .28s cubic-bezier(.2,.9,.3,1.5);filter:drop-shadow(0 5px 0 rgba(0,0,0,.4))}
.node.adv .af::before{content:"";position:absolute;inset:4px;background:var(--slotc);box-shadow:inset 3px 3px 0 rgba(255,255,255,.1),inset -3px -3px 0 rgba(0,0,0,.35)}
.node.adv.done .af::before{background:color-mix(in srgb,var(--rim) 22%,var(--slotc))}
.node.adv.goal .af,.node.adv.goal .af::before{clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.node.adv.goal .af::before{clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.node.adv.challenge .af{background:transparent}
.node.adv.challenge .af::after{content:"";position:absolute;inset:-6px;z-index:-1;background:var(--rim);clip-path:polygon(50% 0,62% 14%,86% 14%,86% 38%,100% 50%,86% 62%,86% 86%,62% 86%,50% 100%,38% 86%,14% 86%,14% 62%,0 50%,14% 38%,14% 14%,38% 14%)}
.node.adv.challenge .af::before{inset:8px;box-shadow:inset 0 0 0 3px var(--rim),inset 3px 3px 0 rgba(255,255,255,.1)}
.node.adv.challenge.done .af{filter:drop-shadow(0 5px 0 rgba(0,0,0,.4)) drop-shadow(0 0 10px rgba(176,108,255,.55))}
.node.adv img{position:relative;width:38px;height:38px;z-index:1}
.node.adv.root img{width:50px;height:50px}
.node.adv.root .af{filter:drop-shadow(0 5px 0 rgba(0,0,0,.4)) drop-shadow(0 0 16px rgba(232,180,58,.6))}
.node.adv.locked img{filter:grayscale(1) brightness(.8);opacity:.55}
.node.adv.prog .af{animation:advPulse 1.6s ease-in-out infinite}
@keyframes advPulse{50%{filter:drop-shadow(0 5px 0 rgba(0,0,0,.4)) drop-shadow(0 0 14px rgba(232,180,58,.9))}}
.node.adv:hover .af,.node.adv:focus-visible .af{transform:scale(1.14) rotate(-3deg)}
.node.adv:focus-visible{outline:none}
.node.adv:focus-visible .af{outline:3px solid var(--accent);outline-offset:6px}
.alock{position:absolute;right:-6px;bottom:-6px;z-index:2;width:20px;height:20px;padding:3px;background:#7a7f8c;box-shadow:0 0 0 2px #0d0e12;color:#0d0e12}
.alock svg{width:14px;height:14px}
.anl{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);display:grid;justify-items:center;gap:2px;width:126px;text-align:center;pointer-events:none}
.anl b{font:600 13px/1.25 var(--f-ui);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.anl small{font:400 15px/1 var(--f-num);color:#e8d9a8;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.node.adv.locked .anl b{color:#b9bcc6}
.node.adv.root .anl b{font-size:14px;color:#ffe08a}
:root[data-theme="light"] .anl b{color:#1b1d22;text-shadow:none}
:root[data-theme="light"] .anl small{color:#8a6420;text-shadow:none}
:root[data-theme="light"] .node.adv.root .anl b{color:#8a5a00}
:root[data-theme="light"] .node.adv{--slotc:#f6f1e4}
:root[data-theme="light"] .node.adv .af::before{box-shadow:inset 3px 3px 0 rgba(255,255,255,.7),inset -3px -3px 0 rgba(0,0,0,.12)}
:root[data-theme="light"] .adv-view{box-shadow:inset 0 0 0 3px #b9ab8c,inset 0 0 50px rgba(120,90,40,.18)}
:root[data-theme="light"] .lane-t,:root[data-theme="light"] .era{background:rgba(255,252,244,.9);color:#2a2418;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--lc,#b9ab8c) 80%,transparent),3px 3px 0 rgba(120,90,40,.2)}
:root[data-theme="light"] .era{--lc:#b9ab8c}
:root[data-theme="light"] .al-o{stroke:#5a4a30}
:root[data-theme="light"] .al-i.done{stroke:#fffaf0}
@media (prefers-reduced-motion:reduce){.node.adv.prog .af,.al-i.prog{animation:none}}
:root[data-theme="light"] .node.adv.locked .anl b{color:#7d808a}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .links{display:none}

function ico(name,pal){

  const key=name+(pal?JSON.stringify(pal):'');
  if(icache[key])return icache[key];
  const d=ICONS[name],P=Object.assign({},d.pal,pal||{});
  const c=document.createElement('canvas');c.width=16;c.height=16;const g=c.getContext('2d');
  d.map.forEach((row,y)=>{for(let x=0;x<16&&x<row.length;x++){const ch=row[x];if(ch!=='.'&&P[ch]){g.fillStyle=P[ch];g.fillRect(x,y,1,1)}}});
  return icache[key]=c.toDataURL();
}

}

 {id:'n1',date:'2026-09-21',tags:['AI','Transformer'],min:8,
  title:{zh:'从零写注意力：十二行代码里的 Transformer 核心',en:'Attention from Scratch in Twelve Lines'},
  ex:{zh:'不带多头、不带投影的最小注意力实现，以及几个容易被忽略的细节。',en:'A minimal attention function with no heads or projections, and the details that are easy to miss.'},
  body:{zh:`<p>注意力机制只做一件事：让每个位置按相关程度，从其他位置取信息。下面是不带多头、不带投影的最小版本。</p>
<pre class="code"><span class="code-lang">PYTHON</span><code>def attention(q, k, v, mask=None):
    scores = q @ k.transpose(-2, -1) / k.size(-1) ** 0.5
    if mask is not None:
        scores = scores.masked_fill(mask == 0, float('-inf'))
    weights = scores.softmax(dim=-1)
    return weights @ v</code></pre>
<p>几个容易忽略的细节：</p>
<ul><li>除以 √d 是为了让点积的方差不随维度增大。不除的话 softmax 很快饱和，梯度接近零。</li><li>mask 填 <code>-inf</code> 而不是一个很大的负数，softmax 之后正好是 0。</li><li>这个函数本身没有可学习参数，参数都在生成 q、k、v 的线性层里。</li></ul>
<p>下一篇在这个基础上加多头和位置编码，然后训练一个会写数据包函数名的小模型。</p>`,
  en:`<p>Attention does one thing: each position pulls information from the others, weighted by relevance. Here is the minimal version, with no heads and no projections.</p>
<pre class="code"><span class="code-lang">PYTHON</span><code>def attention(q, k, v, mask=None):
    scores = q @ k.transpose(-2, -1) / k.size(-1) ** 0.5
    if mask is not None:
        scores = scores.masked_fill(mask == 0, float('-inf'))
    weights = scores.softmax(dim=-1)
    return weights @ v</code></pre>
<p>Details that are easy to miss:</p>
<ul><li>Dividing by √d keeps the variance of the dot products from growing with dimension. Without it, softmax saturates and gradients vanish.</li><li>The mask uses <code>-inf</code> rather than a large negative number, so masked weights come out as exactly 0.</li><li>The function has no learnable parameters. They all live in the linear layers that produce q, k and v.</li></ul>
<p>Next time: multiple heads, positional encoding, and a small model that writes datapack function names.</p>`}},
 {id:'n2',date:'2026-08-30',tags:['Minecraft','Datapack'],min:6,
  title:{zh:'用状态机写 Boss：数据包里的阶段切换',en:'Writing Bosses as State Machines'},
  ex:{zh:'把散落在十几个函数里的阶段判断，改成一个计分板加一个入口函数。',en:'Replacing phase checks scattered over a dozen functions with one scoreboard and one entry function.'},
  body:{zh:`<p>写 Boss 最容易失控的地方是阶段切换。早期我把判断散落在十几个函数里，加一个技能要改好几处。后来改成显式的状态机：一个计分板记录当前阶段，每 tick 只做两件事，读血量，判断要不要切换。</p>
<pre class="code"><span class="code-lang">MCFUNCTION</span><code># 每 tick 读取血量并判断是否切换阶段
execute as @e[tag=ember_boss] store result score @s hp run data get entity @s Health
execute as @e[tag=ember_boss,scores={phase=1,hp=..400}] run function ember:phase/enter_2
execute as @e[tag=ember_boss,scores={phase=2,hp=..200}] run function ember:phase/enter_3</code></pre>
<p>每个阶段的进入函数负责三件事：改计分板、清理上一阶段的实体、播放过场。技能调度只看 <code>phase</code> 分数，技能之间互相不知道对方存在。这样加第四阶段只需要新建一个文件夹。</p>`,
  en:`<p>Phase transitions are where boss code gets out of hand. I used to scatter the checks across a dozen functions, so adding one skill meant editing several files. Now each boss is an explicit state machine: one scoreboard holds the phase, and every tick does two things. Read health, decide whether to switch.</p>
<pre class="code"><span class="code-lang">MCFUNCTION</span><code># every tick: read health, maybe switch phase
execute as @e[tag=ember_boss] store result score @s hp run data get entity @s Health
execute as @e[tag=ember_boss,scores={phase=1,hp=..400}] run function ember:phase/enter_2
execute as @e[tag=ember_boss,scores={phase=2,hp=..200}] run function ember:phase/enter_3</code></pre>
<p>Each phase's entry function does three things: set the score, clean up the previous phase's entities, play the transition. Skill scheduling only reads the <code>phase</code> score, and skills never reference each other. Adding a fourth phase is one new folder.</p>`}},
 {id:'n3',date:'2026-07-12',tags:[{zh:'论文笔记',en:'Paper notes'},'Interpretability'],min:5,
  title:{zh:'读论文笔记：小模型里的规划能力',en:'Reading Notes: Planning in Small Models'},
  ex:{zh:'探针能解码出信息，不代表模型在用它。',en:'A probe decoding something does not mean the model uses it.'},
  body:{zh:`<p>这周读了几篇关于小模型规划能力的论文。共同的发现是：模型在生成第一个词之前，内部表示里已经能线性解码出后面几步的目标。</p>
<p>我更在意方法上的问题。探针能解码出信息，不代表模型在用这些信息。几篇论文里只有一篇做了干预实验：直接修改那个方向上的激活，看输出是否跟着变。这才是更有说服力的证据。</p>
<p>打算做的小实验：在自己训练的小模型上复现探针，再做一次激活修补，看结论是否还成立。</p>`,
  en:`<p>This week I read several papers on planning in small language models. The shared finding: before the first token, the goals of later steps can already be linearly decoded from internal representations.</p>
<p>What I care about more is method. A probe decoding information does not mean the model uses it. Only one of the papers ran an intervention, editing activations along that direction and checking whether the output changes. That is the stronger evidence.</p>

const ABS={"textsteg": {"zh": "一种黑盒文本隐写方法：在多模态大模型生成文本的过程中嵌入秘密信息。码本由双方共享的会话设置动态生成，取代以往黑盒方法的固定码本；再用基于拒绝采样的反馈保证信息能准确提取。嵌入容量和文本质量优于白盒方法，并能在真实社交平台上使用。", "en": "A black-box text steganography method that hides messages while a multimodal LLM generates text. A codebook built on the fly from shared session settings replaces the fixed codebook of earlier black-box methods, and reject-sampling feedback keeps extraction accurate. It beats white-box methods on capacity and text quality and works on real social platforms."}, "mirrorcraft": {"zh": "一个成对评测 Minecraft 智能体的基准：每个 Mirror 世界复制一个原版世界，再用数据包悄悄改掉部分服务器规则，地形、目标和行动预算保持一致。在 5 个生物群系、6 组规则和 6 种智能体配置上，规则变化的影响差别很大；直接告诉智能体确切规则，也只带来有限的提升。", "en": "A paired benchmark for Minecraft agents: each Mirror world copies a Vanilla world but quietly changes server rules through a datapack, with terrain, objectives and budgets kept matched. Across five biomes, six rule suites and six agent setups, the effect of rule changes varies widely, and telling agents the exact rules helps only a little."}, "interchange": {"zh": "多智能体团队里担任同一角色的智能体，能不能随便互换？在独立组建的团队之间交换同角色的智能体，任务得分几乎不变，但每单位进展所需的沟通量增加 16%–63%。结论是：智能体在结果上可以互换，在协作效率上却不行。", "en": "Can agents that hold the same role in a multi-agent team be swapped freely? Trading role-matched agents between independently formed teams barely changes task scores, but raises the communication needed per unit of progress by 16–63%. Agents are interchangeable in outcome, not in coordination efficiency."}, "copies": {"zh": "智能体反复转述同一条观察时，汇总者应该数信息来源，而不是数陈述次数。论文定义了“复制权重”：在四个模型上，一条转发的副本相当于 0.06–0.42 条新观测。加一段说明能把它压到 0.08 以下；要求智能体引用而不是复述，过早下结论的比例从 11.2% 降到 1.1%。", "en": "When agents relay and restate the same observation, an aggregator should count sources, not statements. Across four models, a forwarded copy counts as 0.06–0.42 of a new reading. One paragraph of explanation pushes this to 0.08 or below, and asking agents to cite rather than restate cuts early commitment from 11.2% to 1.1%."}, "reed": {"zh": "一种跨域语言隐写分析的后训练方法：检测器训练完成后保持冻结，只在分类前编辑它的中间表示——域适应用域偏移向量，域泛化用从载体指向隐写的方向向量。不改结构、不更新参数，就能提升跨域检测效果，尤其是 F1。", "en": "A post-training method for cross-domain linguistic steganalysis: the trained detector stays frozen and only its intermediate representations are edited before classification, with a domain-offset vector for adaptation and a cover-to-stego direction for generalization. No architecture changes or retraining, and clearly better cross-domain F1."}};

/* ================= tooltip content ================= */
function tipContent(key,inSheet){
  const [k,id]=key.split(':');
  const hint='';
  if(k==='work'){
    const it=ITEMS.find(x=>x.id===id),tc=`var(--t-${it.rarity})`;
    let h=`<div class="tn ${it.rarity==='legendary'?'shine':''}">${t(it.name)}</div><div class="tt">${t(RAR[it.rarity])} · ${t(it.type)}</div><div class="tsep"></div>`;
    if(it.cat==='paper'){
      h+=`<div class="ts"><span>${lang==='zh'?'会议':'Venue'}</span><b style="font-size:18px">${it.venue}</b></div><div class="tauth" style="margin-top:6px">${it.authors.map(a=>a==='Jianxin Gao'?`<b style="color:var(--t-legendary)">${a}</b>`:a).join(', ')}</div>`;
      h+=`<div class="td">${t(it.abstract).slice(0,lang==='zh'?60:130)}…</div>`;
    }else{
      h+=it.stats.map(s=>`<div class="ts"><span>${t(s.n)}</span><b>${s.v}</b></div>`).join('');
      if(it.lines)h+=it.lines.map(l=>`<div class="tl">${t(l)}</div>`).join('');
      h+=`<div class="td">${t(it.desc)}</div>`;
    }
    h+=`<div class="tags">${(it.tags||[]).map(x=>`<span>${x}</span>`).join('')}${it.sample?`<span class="tsm">${t(S.sample)}</span>`:''}</div>${hint}`;
    return {html:h,tc};
  }
  if(k==='node'){
    const n=TREE.find(x=>x.id===id);
    const tc=n.st==='done'?(n.t==='challenge'?'var(--t-epic)':'var(--t-uncommon)'):n.st==='prog'?'var(--t-legendary)':'var(--t-common)';
    const st=n.st==='done'?t(S.done):n.st==='prog'?t(S.prog):t(S.locked);
    return {tc,html:`<div class="tn">${t(n.n)}</div><div class="tt">${st}${n.d?' · '+n.d:''}</div><div class="tsep"></div><div class="td" style="margin-top:0">${t(n.x)}</div><div class="tags"><span>${t(NTYPE[n.t]||NTYPE.task)}</span>${n.d?'':`<span class="tsm">${lang==='zh'?'日期待补充':'Date TBD'}</span>`}</div>`};
  }
  if(k==='ach'){
    const a=ACH.find(x=>x.id===id),ok=got.has(id);
    return {tc:ok?'var(--t-legendary)':'var(--t-common)',html:`<div class="tn">${t(a.n)}</div><div class="tt">${ok?t(S.achGet):t(S.achLocked)}</div><div class="tsep"></div><div class="td" style="margin-top:0">${t(a.x)}</div>`};
  }
  return {tc:'var(--t-epic)',html:`<div class="tn">Jianxin Gao</div><div class="tt">${t(RAR.epic)} · ${lang==='zh'?'玩家 · AI 本科生':'Player · AI undergrad'}</div><div class="tsep"></div>
    <div class="ts"><span>${lang==='zh'?'主修':'Major'}</span><b style="font-size:18px">AI</b></div>
    <div class="ts"><span>${lang==='zh'?'常用':'Tools'}</span><b style="font-size:18px">Python · PyTorch</b></div>
    <div class="ts"><span>${lang==='zh'?'副业':'Side quest'}</span><b style="font-size:18px">mcfunction</b></div>
    <div class="td">${lang==='zh'?'地面上那只散步的猫，就是我。':'The cat strolling on the surface? That is me.'}</div>`};
}

/* ================= tooltip behaviour ================= */
const tip=el('tip'),tipBody=el('tipBody'),tipFrame=el('tipFrame');
let tipEl=null,tx=0,ty=0,cx=0,cy=0,tipRaf=0;
function countInspect(key){if(!/^(work|node):/.test(key))return;inspected.add(key);if(inspected.size>=5)unlock('inspect')}
function openTip(target,x,y){
  const c=tipContent(target.dataset.tip,false);
  tipFrame.style.setProperty('--tc',c.tc);tipBody.innerHTML=c.html;
  tip.classList.remove('on');void tip.offsetWidth;tip.classList.add('on');
  tx=cx=x;ty=cy=y;placeTip(true);tipEl=target;countInspect(target.dataset.tip);
  if(!tipRaf)tipRaf=requestAnimationFrame(tipLoop);
}
function hideTip(){tipEl=null;tip.classList.remove('on')}
function placeTip(snap){

let cardSizes=null;
const LMTOPK={home:24,workshop:30,obs:32,tower:60,mill:44,summit:66,camp:18};const LMTOP=LMK.map(k=>LMTOPK[k]);

  if(!RM&&quick){p.animate([{transform:'translate(-50%,-48%) scale(.97)',opacity:0},{transform:'translate(-50%,-50%)',opacity:1}],{duration:240,easing:'cubic-bezier(.2,.9,.3,1)'})}

  const cin=card&&card.querySelector('.card-in');

function canScroll(el,dy){if(!el)return false;const max=el.scrollHeight-el.clientHeight;if(max<2)return false;return dy<0?el.scrollTop>1:el.scrollTop<max-1}
function onWheel(e){

  const unit=e.deltaMode===1?32:e.deltaMode===2?innerHeight:1,dx=e.deltaX*unit,dy=e.deltaY*unit,horiz=Math.abs(dx)>Math.abs(dy);
  const tv=tg.closest('.tree-view');if(tv&&(horiz?tv.scrollWidth>tv.clientWidth:canScroll(tv,dy)))return;

  if(pn&&!horiz){for(let n=tg;n&&n!==document.body;n=n.parentElement){if(n===pn||/(auto|scroll)/.test(getComputedStyle(n).overflowY)){if(canScroll(n,dy))return}if(n===pn)break}}

function endDrag(){if(!drag)return;drag=null;document.body.classList.remove('dragging');setTimeout(()=>dragged=false,0)}
addEventListener('blur',()=>{endDrag();dragged=false});
document.addEventListener('pointerleave',()=>{if(drag){if(dragged)dragEnd=performance.now();endDrag()}});
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('.xpanel,.nav,.card,a,button,dialog,.sheet,.tip,.menu,.bpick,.hero-in .hello,.hero-in .hud'))return;
  drag={x:e.clientX,y:e.clientY,t0:J.target,id:e.pointerId,ld:0,lt:performance.now(),v:0};dragged=false;
});
addEventListener('pointermove',e=>{
  if(!drag)return;
  if(e.pointerType==='mouse'&&e.buttons===0){endDrag();return}
  if(e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y,d=Math.abs(dx)>=Math.abs(dy)?dx:dy*1.2;
  if(!dragged&&Math.hypot(dx,dy)>6){dragged=true;if(J.open>=0)closePanel();document.body.classList.add('dragging');hideTip()}
  if(dragged){const now=performance.now(),dtm=Math.max(1,now-drag.lt);drag.v=drag.v*.6+((d-drag.ld)/dtm)*.4;drag.ld=d;drag.lt=now;jset(drag.t0-d/(world.SP*world.S))}
},{passive:true});
addEventListener('pointerup',()=>{if(drag){if(dragged)dragEnd=performance.now();if(dragged&&Math.abs(drag.v)>.15&&performance.now()-drag.lt<90)jset(J.target-drag.v*260/(world.SP*world.S));drag=null;document.body.classList.remove('dragging');setTimeout(()=>dragged=false,0)}});
addEventListener('pointercancel',()=>{if(drag){drag=null;dragged=false}});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(dlg.open)return;
  if(e.key==='Escape'){if(J.open>=0){closePanel();return}hideTip();closeSheet();toggleMenu(false);return}
  if(J.open>=0)return;
  const c=e.target.closest&&e.target.closest('.card');
  if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openPanel(+c.dataset.card);return}
  if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)||(e.key===' '&&!c)){e.preventDefault();jgo(Math.round(J.target)+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();jgo(Math.round(J.target)-1)}
  else if(e.key==='Home')jgo(0);else if(e.key==='End')jgo(J.N-1);
});
// hover-dwell on cards
let dwellT=0,dwellCard=null;
const DWELL=900;
function stopDwell(){if(dwellCard){dwellCard.classList.remove('dwelling');dwellCard=null}clearTimeout(dwellT)}
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const c=e.target.closest&&e.target.closest('.card');
  if(!c){if(dwellCard)stopDwell();return}
  if(c===dwellCard||J.open>=0||drag||Math.abs(J.target-J.pos)>.06)return;
  stopDwell();dwellCard=c;c.style.setProperty('--dw',DWELL+'ms');c.classList.add('dwelling');
  dwellT=setTimeout(()=>{if(dwellCard===c&&!dragged&&Math.abs(J.target-J.pos)<.06){stopDwell();openPanel(+c.dataset.card)}},DWELL);
},{passive:true});
document.addEventListener('pointerout',e=>{if(dwellCard&&e.target.closest&&e.target.closest('.card')===dwellCard&&!dwellCard.contains(e.relatedTarget))stopDwell()});
let tiltCard=null;
document.addEventListener('pointermove',e=>{
  const c=e.target.closest&&e.target.closest('.ncard');
  if(tiltCard&&tiltCard!==c){tiltCard.style.transform='';tiltCard=null}
  if(c&&HOVER.matches&&!RM){const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    c.style.setProperty('--mx',px*100+'%');c.style.setProperty('--my',py*100+'%');
    c.style.transform=`translateY(-6px) rotateX(${(.5-py)*7}deg) rotateY(${(px-.5)*9}deg)`;tiltCard=c}
  if(HOVER.matches&&!drag){const bare=!e.target.closest('.xpanel,.nav,a,button,.card,.hero-in .hello,.hero-in .hud,.hero-in .av,.tip,.sheet,dialog,#veil');document.body.style.cursor=bare&&world.hover(e.clientX,e.clientY)?'pointer':''}
},{passive:true});

/* ================= page motion ================= */
function splitTag(){
  const h=document.querySelector('.hero-tag');if(!h||RM)return;let k=0;
  const wrap=node=>{[...node.childNodes].forEach(n=>{
    if(n.nodeType===3){const parts=/[\u4e00-\u9fff]/.test(n.textContent)?[...n.textContent]:n.textContent.split(/(\s+)/);const frag=document.createDocumentFragment();
      parts.forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){frag.appendChild(document.createTextNode(p));return}const s=document.createElement('span');s.className='ch';s.style.setProperty('--k',k++);s.textContent=p;frag.appendChild(s)});
      node.replaceChild(frag,n)}
    else if(n.nodeType===1&&n.tagName!=='BR')wrap(n)})};
  wrap(h);
}
function ripple(btn,color){
  if(RM)return;const r=btn.getBoundingClientRect();const d=document.createElement('i');
  d.style.cssText=`position:fixed;left:${r.left+r.width/2-10}px;top:${r.top+r.height/2-10}px;width:20px;height:20px;border-radius:50%;background:${color};z-index:45;pointer-events:none`;
  document.body.appendChild(d);
  d.animate([{transform:'scale(0)',opacity:.55},{transform:`scale(${Math.hypot(innerWidth,innerHeight)/9})`,opacity:0}],{duration:900,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>d.remove();
  btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop');
}

/* ================= clicks ================= */
let logoClicks=[];
document.addEventListener('click',e=>{
  if(dragged&&performance.now()-dragEnd<250)return;
  dragged=false;
  const stp=e.target.closest('[data-step]');if(stp){jgo(+stp.dataset.step,true);return}
  const cl=e.target.closest('[data-close]');if(cl){closePanel();return}
  const ck=e.target.closest('[data-clock]');if(ck){syncClock();toggleMenu(false);return}
  if(e.target===veil){closePanel();return}
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();if(go.closest('.nav')){const gi=SEC.findIndex(x=>x.id===go.dataset.go);if(gi>=0)fastGo(gi)}else scrollToId(go.dataset.go);toggleMenu(false);return}
  const cd=e.target.closest('.card');if(cd){stopDwell();openPanel(+cd.dataset.card);return}
  const f=e.target.closest('[data-filter]');
  if(f){filter=f.dataset.filter;$$('[data-filter]').forEach(b=>b.setAttribute('aria-selected',b===f));renderInv(true);return}
  const pf=e.target.closest('[data-pubf]');if(pf){pubFilter=pf.dataset.pubf;$$('[data-pubf]').forEach(b=>b.setAttribute('aria-selected',b===pf));renderPubList(true);return}
  const ab=e.target.closest('[data-abs]');if(ab){toggleAbs(ab);return}
  const cab=e.target.closest('[data-copy-allbib]');if(cab){copyText(ITEMS.filter(i=>i.cat==='paper').map(p=>p.bib).join('\n\n'),null);return}
  const ph=e.target.closest('[data-phase]');if(ph){setPhase(+ph.dataset.phase);return}
  const cb=e.target.closest('[data-copy-bib]');if(cb){const it=ITEMS.find(x=>x.id===cb.dataset.copyBib);copyText(it.bib,el('bib-'+it.id));return}
  const cp=e.target.closest('[data-copy]');if(cp){copyText(cp.dataset.copy,el(cp.dataset.sel));return}
  const cpre=e.target.closest('[data-copy-pre]');if(cpre){const c=cpre.parentElement.querySelector('code');copyText(c.textContent,c);return}
  const pr=e.target.closest('.pub[data-pub]');if(pr){if(PUBWIDE.matches)selectPub(pr.dataset.pub);else{pubSel=pr.dataset.pub;openDetail('work',pr.dataset.pub)}return}
  const ppr=e.target.closest('[data-paper]');if(ppr){closeModal();pubSel=ppr.dataset.paper;pubFilter='all';pubQuery='';const gi=SEC.findIndex(x=>x.id==='papers');fastGo(gi);renderPapers();return}
  const op=e.target.closest('[data-open]');
  if(op){if(dragMoved)return;const [k,id]=op.dataset.open.split(':');
    if(!HOVER.matches&&op.dataset.tip)openSheet(op.dataset.tip,()=>openDetail(k,id));else openDetail(k,id);return}
  const tp=e.target.closest('[data-tip]');
  if(tp&&!HOVER.matches&&!dragMoved){openSheet(tp.dataset.tip,null);return}
  if(!e.target.closest('.xpanel,.nav,a,button,.card,.hero-in .hello,.hero-in .hud,.hero-in .av,.tip,.sheet,dialog'))world.click(e.clientX,e.clientY);
});
el('logo').addEventListener('click',()=>{
  fastGo(0);
  const now=Date.now();logoClicks=logoClicks.filter(x=>now-x<2200);logoClicks.push(now);
  if(logoClicks.length>=5){logoClicks=[];blockRain();unlock('egg',true)}
});
el('langBtn').addEventListener('click',()=>{
  lang=lang==='zh'?'en':'zh';store.set('lang',lang);hideTip();closeSheet();
  renderAll();
  if(!RM)[el('heroIn'),el('cards'),J.open>=0?PANELS[J.open]:null].filter(Boolean).forEach(p=>p.animate([{opacity:.3,filter:'blur(4px)'},{opacity:1,filter:'blur(0)'}],{duration:520,easing:'ease-out'}));
  ripple(el('langBtn'),'rgba(140,200,255,.5)');
  unlock(lang==='en'?'hello':'nihao',true);
});
el('themeBtn').addEventListener('click',()=>{
  const next=isDark()?'light':'dark';
  ripple(el('themeBtn'),next==='dark'?'rgba(10,14,40,.6)':'rgba(255,236,170,.65)');
  const liveWant=nightF()>.5?'dark':'light';
  if(tmode!=='auto'&&next===liveWant){tmode='auto';store.set('tmode',null);world.sunHr=world.moonHr=nowHr()}
  else{tmode=next;store.set('tmode',next);world.sunHr=14.5;world.moonHr=22.5}
  root.dataset.theme=next;renderClock();renderThemeBtn();world.setNight(skyT());
  unlock(next==='dark'?'night':'day',true);
});
el('weatherBtn').addEventListener('click',toggleWeather);
el('biomeBtn').addEventListener('click',e=>{e.stopPropagation();openBiomePick()});
function themeChanged(){applyPalette();renderThemeBtn();renderClock();world.setNight(skyT())}
new MutationObserver(themeChanged).observe(root,{attributes:true,attributeFilter:['data-theme']});
DARKMQ.addEventListener&&DARKMQ.addEventListener('change',()=>{if(!root.dataset.theme)themeChanged()});
HOVER.addEventListener&&HOVER.addEventListener('change',()=>renderAll());
function toggleMenu(open){const m=el('menu');open=open==null?m.hidden:open;m.hidden=!open;el('menuBtn').setAttribute('aria-expanded',open)}
el('menuBtn').addEventListener('click',e=>{e.stopPropagation();toggleMenu()});
document.addEventListener('pointerdown',e=>{if(!el('menu').hidden&&!e.target.closest('#menu,#menuBtn'))toggleMenu(false)});

document.addEventListener('input',e=>{if(e.target.id==='pubQ'){pubQuery=e.target.value;renderPubList(false)}});
/* ================= boot ================= */
applyPalette();
renderAll();
world.init();
afterFrame();
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{world.resize();cardSizes=null;afterFrame()},120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{cardSizes=null;afterFrame()});
setTimeout(()=>unlock('first'),1500);
})();
</script>
